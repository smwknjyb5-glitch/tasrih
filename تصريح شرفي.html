<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تصريح شرفي</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#1f2937;--mut:#6b7280;--bd:#d1d5db;--pr:#0f766e;--sheet:#fff;--sheet-tx:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mut:#9ca3af;--bd:#374151;--pr:#2dd4bf}}
:root[data-theme="dark"]{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mut:#9ca3af;--bd:#374151;--pr:#2dd4bf}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.7}
h1{text-align:center;margin:16px 0 4px;font-size:1.5rem}
.sub{text-align:center;color:var(--mut);margin:0 0 12px}
.wrap{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.2fr);gap:16px;max-width:1100px;margin:auto;padding:12px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
label{display:block;font-size:.9rem;margin-top:8px;color:var(--mut)}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{flex:1;padding:10px;border:0;border-radius:8px;background:var(--pr);color:#fff;font:inherit;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.sheet{background:var(--sheet);color:var(--sheet-tx);padding:28px 30px;border-radius:6px;min-height:560px;font-size:1.05rem;line-height:2.1;box-shadow:0 2px 10px rgba(0,0,0,.15);overflow-x:auto}
.sheet .rep{text-align:center;font-weight:700;line-height:1.6}
.sheet .rep small{font-weight:400;display:block}
.sheet h2{text-align:center;text-decoration:underline;margin:24px 0 18px;font-size:1.6rem}
.sheet p{margin:0 0 10px;text-align:justify}
.sheet b{border-bottom:1px dotted #555;padding:0 4px}
.sign{display:flex;justify-content:space-between;margin-top:34px}
.sign div{text-align:center;min-width:160px}
.sign .box{height:80px}
@media print{
 body{background:#fff}
 h1,.sub,.card.form{display:none}
 .wrap{display:block;padding:0;max-width:none}
 .card{border:0;padding:0;background:#fff}
 .sheet{box-shadow:none;padding:0;min-height:0}
 @page{size:A4;margin:18mm}
}
</style>
</head>
<body>
<h1>تصريح شرفي</h1>
<p class="sub">املأ البيانات وسيظهر التصريح مباشرة، ثم اطبعه أو احفظه PDF</p>
<div class="wrap">
 <div class="card form">
  <label>اللقب والاسم<input id="name" placeholder="مثال: بن علي محمد"></label>
  <div class="row">
   <label>تاريخ الميلاد<input id="bdate" type="date"></label>
   <label>مكان الميلاد<input id="bplace" placeholder="عنابة"></label>
  </div>
  <div class="row">
   <label>ابن / ابنة<input id="father" placeholder="اسم الأب"></label>
   <label>و<input id="mother" placeholder="اسم الأم ولقبها"></label>
  </div>
  <label>العنوان<input id="addr" placeholder="الحي، البلدية، الولاية"></label>
  <div class="row">
   <label>رقم بطاقة التعريف<input id="idn" inputmode="numeric"></label>
   <label>الصادرة بتاريخ / عن<input id="idinfo" placeholder="2022/05/10 دائرة عنابة"></label>
  </div>
  <label>المهنة (اختياري)<input id="job"></label>
  <label>موضوع التصريح
   <select id="tpl">
    <option value="0">نص حر</option>
    <option value="1">عدم ممارسة أي نشاط مهني وعدم تقاضي دخل</option>
    <option value="2">الإقامة بالعنوان المذكور</option>
    <option value="3">العزوبة (عدم الزواج)</option>
    <option value="4">عدم الاستفادة من منحة أو مساعدة اجتماعية</option>
    <option value="5">صحة المعلومات والوثائق المقدمة</option>
   </select>
  </label>
  <label>نص التصريح (قابل للتعديل)<textarea id="body"></textarea></label>
  <label>موجه إلى (اختياري)<input id="to" placeholder="السيد رئيس ..."></label>
  <div class="row">
   <label>المكان<input id="place" placeholder="عنابة"></label>
   <label>التاريخ<input id="date" type="date"></label>
  </div>
  <div class="btns">
   <button onclick="window.print()">طباعة / PDF</button>
   <button class="sec" onclick="resetAll()">مسح</button>
  </div>
 </div>
 <div class="card"><div class="sheet" id="sheet"></div></div>
</div>
<script>
var T={
1:"أصرح بشرفي أنني لا أمارس أي نشاط مهني ولا أتقاضى أي أجر أو دخل من أي جهة كانت.",
2:"أصرح بشرفي أنني مقيم(ة) فعلياً بالعنوان المذكور أعلاه.",
3:"أصرح بشرفي أنني عازب(ة) إلى غاية تاريخ تحرير هذا التصريح.",
4:"أصرح بشرفي أنني لا أستفيد من أي منحة أو مساعدة اجتماعية من أي جهة كانت.",
5:"أصرح بشرفي أن جميع المعلومات والوثائق التي قدمتها صحيحة ومطابقة للواقع."
};
var ids=["name","bdate","bplace","father","mother","addr","idn","idinfo","job","tpl","body","to","place","date"];
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function v(i,ph){var x=$(i).value.trim();return "<b>"+(x?esc(x):ph||"..................")+"</b>"}
function fd(s){if(!s)return "";var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function render(){
 var d=$("bdate").value,dt=$("date").value;
 var h='<div class="rep">الجمهورية الجزائرية الديمقراطية الشعبية<small>République Algérienne Démocratique et Populaire</small></div>';
 if($("to").value.trim())h+='<p style="text-align:left;margin-top:12px">إلى: <b>'+esc($("to").value.trim())+'</b></p>';
 h+='<h2>تصريح شرفي</h2>';
 h+='<p>أنا الممضي أسفله، السيد(ة): '+v("name")+'</p>';
 h+='<p>المولود(ة) في: '+(d?"<b>"+fd(d)+"</b>":"<b>..................</b>")+' بـ: '+v("bplace")+'</p>';
 h+='<p>ابن(ة): '+v("father")+' و: '+v("mother")+'</p>';
 h+='<p>الساكن(ة) بـ: '+v("addr")+'</p>';
 if($("job").value.trim())h+='<p>المهنة: '+v("job")+'</p>';
 h+='<p>حامل(ة) لبطاقة التعريف الوطنية رقم: '+v("idn")+' الصادرة بتاريخ / عن: '+v("idinfo")+'</p>';
 h+='<p>'+(esc($("body").value.trim()).replace(/\n/g,"<br>")||"..............................................................")+'</p>';
 h+='<p>وهذا تصريح مني بصحة ما ورد أعلاه، وأتحمل كامل المسؤولية القانونية في حالة ثبوت عكس ذلك.</p>';
 h+='<div class="sign"><div>حرر بـ: '+v("place")+'<br>في: '+(dt?"<b>"+fd(dt)+"</b>":"<b>..../..../........</b>")+'</div><div>إمضاء المصرّح<div class="box"></div></div></div>';
 $("sheet").innerHTML=h;
 save();
}
function save(){try{var o={};ids.forEach(function(i){o[i]=$(i).value});localStorage.setItem("tasrih",JSON.stringify(o))}catch(e){}}
function load(){try{var o=JSON.parse(localStorage.getItem("tasrih")||"null");if(o)ids.forEach(function(i){if(o[i]!=null)$(i).value=o[i]})}catch(e){}}
function resetAll(){ids.forEach(function(i){$(i).value=i==="tpl"?"0":""});render()}
ids.forEach(function(i){$(i).addEventListener("input",render)});
$("tpl").addEventListener("change",function(){var t=T[$("tpl").value];if(t)$("body").value=t;render()});
load();
if(!$("date").value){var n=new Date();$("date").value=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")}
render();
</script>
</body>
</html>
